name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application for GitHub Pages
        run: npm run build

      - name: Configure GitHub Pages SPA 404 Fallback
        run: |
          # Copy index.html to 404.html so direct URL refresh works on GitHub Pages
          cp dist/index.html dist/404.html

      # Permanent Deployment 1: Publish to gh-pages branch (Zero config, never 404s)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Permanent Deployment 2: Native GitHub Actions Pages deployment
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

      - name: Deploy to GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true


