spring:
  application:
    name: portfolio-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:./data/portfolio.db}
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

portfolio:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin123!@#}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
